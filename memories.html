<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title> Memories Section </title>
    <!-- Nhập phông Marcellus và Great Vibes để đồng bộ với trang chủ -->
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            background-color: #40040e !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Khung chứa nội dung kỷ niệm */
        .container {
            background-image: url('Lilies.jfif');
            background-size: cover;
            background-position: center;
            border: 4px solid #4a2e15; 
            border-radius: 12px;
            padding: 50px 80px; 
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 700px;       
            max-width: 92vw;
            z-index: 10;
            position: relative;
        }

        /* Lớp phủ mờ sáng */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 248, 231, 0.88); 
            border-radius: 8px;
            z-index: 1;
        }

        .container > * {
            position: relative;
            z-index: 2;
        }
        
        /* Tiêu đề trang kỷ niệm */
        h1 { 
            font-family: 'Marcellus', serif !important;
            color: #4a2e15;
            font-size: 32px; 
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Khu vực trưng bày nội dung/thư mục kỷ niệm */
        .content-box {
            color: #4a2e15;
            font-family: 'Marcellus', serif;
            font-size: 18px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #4a2e15;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.4);
        }
        
        /* Nút quay lại trang chủ */
        .btn-back {
            font-family: 'Great Vibes', cursive !important;
            display: inline-block;
            padding: 10px 30px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #4a2e15;
            border-radius: 6px;
            font-size: 24px; 
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .btn-back:hover {
            background-color: #fff8e7;
            color: #4a2e15;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Memories Section</h1>
        <div class="content-box">
            <p>Nơi lưu giữ những mảnh ký ức... (Sau này bạn thích nhét ảnh hay viết gì vào đây cũng được nhé!)</p>
        </div>
        <div>
            <a href="index.html" class="btn-back">✨ Quay lại trang chủ</a>
        </div>
    </div>
</body>
</html>
