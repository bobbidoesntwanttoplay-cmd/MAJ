<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MY FUCKING SPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Press Start 2P', monospace !important; }

        body {
            background-color: #0abab5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Chỉnh tỉ lệ cho ảnh ngang hiển thị chuẩn ở 4 góc */
        .corner-img {
            position: fixed;
            width: 400px;  /* Chiều rộng hoa văn */
            height: auto;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Căn chỉnh 4 góc cho ảnh ngang */
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; transform: scaleX(-1); }
        .bottom-left { bottom: 0; left: 0; transform: scaleY(-1); }
        .bottom-right { bottom: 0; right: 0; transform: scale(-1, -1); }

        .container {
            background-color: #fff8e7;
            border: 3px solid #4a2e15;
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10;
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 18px;
            margin-bottom: 25px;
        }
        
        .btn-folder {
            display: inline-block;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border-radius: 6px;
            font-size: 9px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- Dùng đúng tên file mới của bạn -->
    <img src="image_2026-08-17_174206260-removebg-preview.png" class="corner-img top-left" alt="">
    <img src="image_2026-08-17_174206260-removebg-preview.png" class="corner-img top-right" alt="">
    <img src="image_2026-08-17_174206260-removebg-preview.png" class="corner-img bottom-left" alt="">
    <img src="image_2026-08-17_174206260-removebg-preview.png" class="corner-img bottom-right" alt="">

    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
