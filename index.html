<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MY FUCKING SPACE/title>
    <!-- Nhập font Pixel chuẩn từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Press Start 2P', monospace !important;
        }

        body {
            /* Nền xanh Tiffany chuẩn tuyệt đối */
            background-color: #0abab5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Cấu hình chung cho hoa văn ở 4 góc */
        .corner-img {
            position: fixed;
            width: 420px;  /* Kích thước hoa văn ở mỗi góc, thích to nhỏ có thể tăng giảm số này */
            height: auto;
            pointer-events: none; /* Không cản trở click chuột */
            z-index: 1; /* Nằm dưới hộp nội dung */
            /* Nếu ảnh nền tối mà chìm quá, bật dòng filter dưới đây lên để nó thành màu trắng sáng cho nổi: */
            /* filter: invert(100%) brightness(200%); */
        }
        
        /* Xoay và lật đối xứng chuẩn cho từng góc */
        .top-left { 
            top: 0; 
            left: 0; 
        }
        .top-right { 
            top: 0; 
            right: 0; 
            transform: scaleX(-1); /* Lật ngược ngang cho góc phải */
        } 
        .bottom-left { 
            bottom: 0; 
            left: 0; 
            transform: scaleY(-1); /* Lật ngược dọc cho góc dưới */
        } 
        .bottom-right { 
            bottom: 0; 
            right: 0; 
            transform: scale(-1, -1); /* Lật cả ngang lẫn dọc cho góc dưới bên phải */
        }

        /* Hộp chứa nội dung chính ở giữa */
        .container {
            background-color: #fff8e7; /* Màu kem retro */
            border: 3px solid #4a2e15; /* Viền nâu đậm */
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10; /* Nằm trên cùng để bấm được nút */
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #5c3a1e;
            border-radius: 6px;
            font-size: 9px;
            text-transform: uppercase;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
            border-color: #4a2e15;
        }
    </style>
</head>
<body>
    <!-- Gắn đúng tên file ảnh mới tách nền của bạn vào 4 góc -->
    <img src="download_1-removebg-preview.png" class="corner-img top-left" alt="">
    <img src="download_1-removebg-preview.png" class="corner-img top-right" alt="">
    <img src="download_1-removebg-preview.png" class="corner-img bottom-left" alt="">
    <img src="download_1-removebg-preview.png" class="corner-img bottom-right" alt="">

    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
