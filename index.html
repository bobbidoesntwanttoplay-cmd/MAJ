<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>✨ MY FUCKING SPACE ✨</title>
    <!-- Nhập chuẩn 2 phông từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* 1. Background tổng thể màn hình là islamic Pattern Wallpaper.jfif */
            background-image: url('islamic Pattern Wallpaper.jfif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Lớp phủ tối nhẹ cho background tổng thể */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }
        
        /* 2. Cái khung ở giữa: Dùng ảnh Lilies.jfif làm nền khung, có viền nâu bao ngoài */
        .container {
            background-image: url('Lilies.jfif');
            background-size: cover;
            background-position: center;
            border: 4px solid #4a2e15; 
            border-radius: 12px;
            padding: 55px 75px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 580px;
            z-index: 10;
            position: relative;
        }

        /* Lớp phủ mờ sáng trên nền khung để chữ đọc rõ hơn */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 248, 231, 0.82); 
            border-radius: 8px;
            z-index: 1;
        }

        .container > * {
            position: relative;
            z-index: 2;
        }
        
        /* BẮT BUỘC ĐỔI: Tiêu đề to dùng phông Playfair Display, ép thẳng tay bằng !important */
        h1 { 
            font-family: 'Playfair Display', serif !important;
            color: #4a2e15;
            font-size: 32px; 
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-weight: 700;
        }
        
        /* Nút bấm giữ phông bay bổng Great Vibes */
        .btn-folder {
            font-family: 'Great Vibes', cursive !important;
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 30px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #4a2e15;
            border-radius: 6px;
            font-size: 26px; 
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> MY CHAOS PLACE </h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
