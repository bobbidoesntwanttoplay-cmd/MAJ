<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>✨MY FUCKING PLACE✨</title>
    <!-- Nhập font Pixel chuẩn từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Press Start 2P', monospace !important;
        }

        body {
            /* Nền xanh Tiffany chuẩn cho toàn bộ trang */
            background-color: #0abab5;
            
            /* Gọi file ảnh đã tách nền vào 4 góc màn hình */
            background-image: url('download-removebg-preview.png'), url('download-removebg-preview.png'), url('download-removebg-preview.png'), url('download-removebg-preview.png');
            background-position: top left, top right, bottom left, bottom right;
            background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
            background-size: 380px auto;
            background-attachment: fixed;
            
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        /* Hộp chứa nội dung chính ở giữa */
        .container {
            background-color: #fff8e7; /* Màu kem retro */
            border: 3px solid #4a2e15; /* Viền nâu đậm */
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10;
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #5c3a1e;
            border-radius: 6px;
            font-size: 9px;
            text-transform: uppercase;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
            border-color: #4a2e15;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
