<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>✨MY FUCKING BLOG✨</title>
    <!-- Nhập font Pixel chuẩn từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Press Start 2P', monospace !important;
        }

        body {
            /* Nền xanh Tiffany chuẩn tuyệt đối cho toàn trang */
            background-color: #0abab5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Lớp phủ để làm tối nhẹ nền xanh, giúp hộp nội dung nổi hơn */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1); /* Phủ đen 10% */
            z-index: -1;
        }
        
        /* Đặt các góc hoa văn cố định ở 4 góc màn hình */
        .corner-decor {
            position: fixed;
            width: 400px; /* Điều chỉnh kích thước hoa văn ở góc cho phù hợp */
            pointer-events: none; /* Không cản trở click chuột */
            z-index: 1;
        }
        
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; transform: scaleX(-1); } /* Lật đối xứng cho đẹp */
        .bottom-left { bottom: 0; left: 0; transform: scaleY(-1); }
        .bottom-right { bottom: 0; right: 0; transform: scale(-1, -1); }

        /* Hộp chứa nội dung chính ở giữa */
        .container {
            background-color: #fff8e7; /* Màu kem retro */
            border: 3px solid #4a2e15; /* Viền nâu đậm */
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10; /* Nằm trên lớp hoa văn */
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #5c3a1e;
            border-radius: 6px;
            font-size: 9px;
            text-transform: uppercase;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
            border-color: #4a2e15;
        }
    </style>
</head>
<body>
    <!-- 4 góc hoa văn được ghim chặt, nằm dưới lớp nội dung -->
    <img src="download.jfif" class="corner-decor top-left" alt="">
    <img src="download.jfif" class="corner-decor top-right" alt="">
    <img src="download.jfif" class="corner-decor bottom-left" alt="">
    <img src="download.jfif" class="corner-decor bottom-right" alt="">

    <div class="container">
        <h1>✨ mY cHAoS plAce ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
