<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>✨ Sanctuarium Animae Meae ✨</title>
    <!-- Nhập phông Cormorant Garamond cho tiêu đề và Great Vibes cho nút -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        html, body {
            background-color: #40040e !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Khung ở giữa: Rộng rãi, thoáng đãng không bị tù */
        .container {
            background-image: url('Lilies.jfif');
            background-size: cover;
            background-position: center;
            border: 4px solid #4a2e15; 
            border-radius: 12px;
            padding: 55px 120px; 
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 680px;       
            max-width: 92vw;
            z-index: 10;
            position: relative;
        }

        /* Lớp phủ mờ sáng trên nền khung */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 248, 231, 0.85); 
            border-radius: 8px;
            z-index: 1;
        }

        .container > * {
            position: relative;
            z-index: 2;
        }
        
        /* Tiêu đề dùng phông Cormorant Garamond với dòng chữ Latin sang trọng */
        h1 { 
            font-family: 'Cormorant Garamond', serif !important;
            color: #4a2e15;
            font-size: 36px; 
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-weight: 700;
        }
        
        /* Nút bấm giữ nguyên phông bay bổng Great Vibes */
        .btn-folder {
            font-family: 'Great Vibes', cursive !important;
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 35px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #4a2e15;
            border-radius: 6px;
            font-size: 26px; 
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sanctuarium Animae Meae</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
