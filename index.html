<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title> MY FUCKING SPACE </title>
    <!-- Nhập phông Ozelot (hoặc fallback về serif độc đáo) -->
    <style>
        @font-face {
            font-family: 'Ozelot';
            src: url('Ozelot.ttf') format('truetype'); /* Nếu bạn có file font Ozelot.ttf tải lên chung thư mục, nó sẽ nhận diện ngay */
            font-weight: normal;
            font-style: normal;
        }

        * {
            font-family: 'Ozelot', serif !important; /* Đổi tất cả chữ thành phông Ozelot */
        }

        body {
            /* Nền xanh Tiffany chủ đạo của trang */
            background-color: #0abab5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Hộp chứa nội dung chính ở giữa, dùng ảnh Lilies.jfif làm background */
        .container {
            background-image: url('Lilies.jfif');
            background-size: cover;
            background-position: center;
            border: 3px solid #4a2e15; /* Viền nâu đậm tạo khung retro */
            border-radius: 12px;
            padding: 50px 70px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 550px;
            z-index: 10;
            position: relative;
        }

        /* Thêm một lớp phủ mờ nhẹ trên nền ảnh để chữ hiển thị rõ nét và dễ đọc hơn */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 248, 231, 0.85); /* Lớp nền kem hơi trong suốt che bớt ảnh nền phía sau */
            border-radius: 9px;
            z-index: 1;
        }

        /* Đưa chữ và nút nổi lên trên lớp phủ */
        .container > * {
            position: relative;
            z-index: 2;
        }
        
        h1 { 
            color: #4a2e15;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 24px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #4a2e15;
            border-radius: 6px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
