<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MY FUCKING BLOG - Pixel Edition</title>
    <!-- Nhập font Pixel chuẩn Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* ÉP TOÀN BỘ TRANG WEB DÙNG FONT PIXEL */
        * {
            font-family: 'PressStart2P', 'Press Start 2P', monospace !important;
        }

        body {
            background-color: #0abab5; /* Nền xanh Tiffany */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            /* Sử dụng ảnh khung mới chuẩn tỷ lệ */
            border-image-source: url('t4aZ4Lh.png');
            border-image-slice: 50 50 50 50;
            border-image-width: 50px;
            border-image-repeat: round;
            
            background-color: #FFFFFF; 
            padding: 50px;
            width: 70vw;
            max-width: 800px;
            text-align: center;
            color: #4a2e15;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 20px; /* Chữ pixel to cần chỉnh nhỏ lại chút cho cân đối */
            margin-top: 0;
            margin-bottom: 25px;
        }
        
        p {
            color: #5c3a1e;
            font-size: 10px; /* Cỡ chữ nhỏ cho đúng chất pixel game */
            line-height: 2;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 25px 0;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #FFFFFF;
            text-decoration: none;
            border: 3px solid #5c3a1e;
            font-size: 9px;
            text-transform: uppercase;
        }
        
        .btn-folder:hover {
            background-color: #FFFFFF;
            color: #4a2e15;
            border-color: #4a2e15;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ mY cHAoS plAce ✨</h1>
        
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>

    </div>
</body>
</html>
