<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>✨MY FUCKING SPACE✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Press Start 2P', monospace !important; }

        body {
            background-color: #0abab5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* 🌟 PHẦN MỚI: Phóng to và ghim 1 ảnh duy nhất làm khung */
        .full-frame-bg {
            position: fixed;
            top: -5%; /* Căn chỉnh lùi ra ngoài một chút để tràn viền đẹp hơn */
            left: -5%;
            width: 110%;  /* Phóng to ảnh vượt quá kích thước màn hình */
            height: 110%;
            object-fit: fill; /* Ép ảnh kéo dãn kín toàn bộ màn hình (dùng cho ảnh gốc có sẵn khung) */
            pointer-events: none; 
            z-index: 1; /* Nằm trên nền xanh nhưng dưới hộp nội dung */
            /* opacity: 0.7; */ /* Có thể chỉnh độ mờ nếu muốn hoa văn nhạt bớt */
        }

        .container {
            background-color: #fff8e7;
            border: 3px solid #4a2e15;
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10; /* Nằm trên cùng để bấm được nút */
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #5c3a1e;
            border-radius: 6px;
            font-size: 9px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <!-- 🌟 Thêm thẻ ảnh duy nhất này vào, nằm trên cùng trong body -->
    <img src="image_2026-08-17_174206260-removebg-preview.png" class="full-frame-bg" alt="">

    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
