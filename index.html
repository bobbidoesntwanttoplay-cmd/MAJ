<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>✨MY FUCKING SPACE✨</title>
    <!-- Nhập font Pixel chuẩn từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Press Start 2P', monospace !important;
        }

        body {
            /* Nền xanh Tiffany chuẩn tuyệt đối */
            background-color: #0abab5;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Cố định hoa văn ở 2 góc, ép chiều rộng và chiều cao bằng nhau để không bị méo dọc */
        .corner-img {
            position: fixed;
            width: 380px;  /* Đặt cứng chiều rộng */
            height: 380px; /* Đặt cứng chiều cao bằng chiều rộng để ảnh vuông vắn chuẩn tỉ lệ */
            object-fit: contain; /* Giữ nguyên hình dáng hoa văn, không bị bóp méo */
            pointer-events: none; 
            z-index: 1; 
            mix-blend-mode: multiply; /* Tự động khử nền trắng, chỉ giữ lại nét hoa văn */
        }
        
        /* Chỉ đặt ở 2 góc trên (hoặc bạn muốn đổi góc nào tùy thích) */
        .top-left { top: 0; left: 0; }
        .top-right { top: 0; right: 0; transform: scaleX(-1); } /* Lật đối xứng sang góc phải */

        /* Hộp chứa nội dung chính ở giữa */
        .container {
            background-color: #fff8e7; /* Màu kem retro */
            border: 3px solid #4a2e15; /* Viền nâu đậm */
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            z-index: 10; 
        }
        
        h1 { 
            color: #4a2e15;
            text-shadow: 2px 2px #0abab5;
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 20px;
            background-color: #4a2e15;
            color: #fff8e7;
            text-decoration: none;
            border: 2px solid #5c3a1e;
            border-radius: 6px;
            font-size: 9px;
            text-transform: uppercase;
        }
        
        .btn-folder:hover {
            background-color: #fff8e7;
            color: #4a2e15;
            border-color: #4a2e15;
        }
    </style>
</head>
<body>
    <!-- Chỉ để hoa văn ở 2 góc (trái và phải) -->
    <img src="download-removebg-preview.png" class="corner-img top-left" alt="">
    <img src="download-removebg-preview.png" class="corner-img top-right" alt="">

    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
