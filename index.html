<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title> MY FUCKING SPACE </title>
    <style>
        @font-face {
            font-family: 'Ozelot';
            src: url('Ozelot.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            font-family: 'Ozelot', serif !important;
        }

        body {
            /* Dùng ảnh Lilies.jfif làm nền toàn màn hình */
            background-image: url('Lilies.jfif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Lớp phủ tối nhẹ để ảnh nền chìm xuống một chút, làm nổi bật khung chữ trắng */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: 1;
        }

        /* Hộp chứa nội dung ở giữa trong suốt hoặc tối màu nhẹ cho hợp vibe */
        .container {
            background-color: rgba(20, 20, 20, 0.75); /* Nền hộp tối mờ sang trọng */
            border: 2px solid rgba(255, 255, 255, 0.4); /* Viền trắng mảnh */
            border-radius: 12px;
            padding: 50px 70px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            max-width: 550px;
            z-index: 10;
        }
        
        h1 { 
            color: #ffffff; /* Chữ màu trắng */
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .btn-folder {
            display: inline-block;
            margin: 15px 0 5px 0;
            padding: 12px 24px;
            background-color: transparent;
            color: #ffffff; /* Chữ nút màu trắng */
            text-decoration: none;
            border: 2px solid #ffffff; /* Viền nút trắng */
            border-radius: 6px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        
        .btn-folder:hover {
            background-color: #ffffff;
            color: #000000; /* Hover đổi ngược lại cho nổi */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ MY CHAOS PLACE ✨</h1>
        <div>
            <a href="memories.html" class="btn-folder">📁 Memories Section</a>
        </div>
    </div>
</body>
</html>
